    <style>
        :root {
            --primary: #2d5a27; /* Verde natural */
            --primary-hover: #1e3f1a;

            --bg-light: #faf8f5;
            --card-bg: #ffffff;

            --border: #e7e5e4;
            --radius-sm: 8px;

            --radius-lg: 24px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--dark);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            color: var(--dark);
        }

        /* Header Fixado */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .nav-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--primary);
        }

        .logo-area img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Barra de Progresso */
        .step-progress {
            background: var(--card-bg);
            padding: 1rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
            max-width: 700px;
            margin: 0 auto;
        }

        .progress-steps::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border);
            z-index: 1;
            transform: translateY(-50%);
        }

        .progress-bar-fill {
            position: absolute;
            top: 50%;
            left: 0;
            height: 2px;
            background: var(--primary);
            z-index: 1;
            transform: translateY(-50%);
            transition: var(--transition);
            width: 0%;
        }

        .step-item {
            position: relative;
            z-index: 2;
            background: var(--card-bg);
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            transition: var(--transition);
        }

        .step-item.active .step-number {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .step-item.completed .step-number {
            border-color: var(--primary);
            background: var(--accent-light);
            color: var(--primary);
        }

        .step-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* Hero Carrossel */
        .hero-carousel {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            margin-bottom: 2.5rem;
        }

        .carousel-track {
            display: flex;
            width: 200%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
        }

        .carousel-slide {
            width: 50%;
            height: 100%;
            position: relative;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.65) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 2.5rem;
            color: white;
        }

        .carousel-overlay h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .carousel-dots {
            position: absolute;
            bottom: 15px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: var(--transition);
        }

        .dot.active {
            background: white;
            width: 24px;
            border-radius: 10px;
        }

        /* Grid da Loja */
        .store-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 2rem;
            align-items: start;
        }

        @media (max-width: 868px) {
            .store-grid { grid-template-columns: 1fr; }
            .hero-carousel { height: 260px; }
            .carousel-overlay h1 { font-size: 1.8rem; }
        }

        /* Cards & Formulários */

        .card-title {

            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.9rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-secondary { background: #e7e5e4; color: var(--dark); }

        .btn-group { display: flex; gap: 10px; margin-top: 1rem; }

        /* Controles de Quantidade */
        .qty-selector {
            display: flex;

            justify-content: space-between;
            background: var(--bg-light);

            padding: 0.5rem;
            border: 1px solid var(--border);
            margin: 1.5rem 0;
        }

        .btn-qty {

            border: 1px solid var(--border);
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .btn-qty:hover { background: var(--primary); color: white; }

        .qty-display { text-align: center; }
        .qty-amount { font-size: 1.5rem; font-weight: 700; color: var(--dark); }

        .location-alert {
            background: var(--accent-light);
            border-left: 4px solid var(--accent);
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            font-size: 1rem;
            outline: none;
        }
        .form-control:focus { border-color: var(--primary); }

        .delivery-options, .payment-options { display: flex; flex-direction: column; gap: 12px; }
        .radio-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            display: flex;
            align-items: flex-start;
            gap: 12px;

            transition: var(--transition);
        }
        .radio-card.selected { border-color: var(--primary); background: rgba(45, 90, 39, 0.03); }

        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background: #25D366;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);

            transition: var(--transition);
        }

        .summary-box { position: sticky; top: 90px; }

        .summary-row.total {

            padding-top: 0.75rem;
            margin-top: 0.75rem;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
        }

            background: var(--bg-light);
            border-radius: var(--radius-md);
            margin: 1rem 0;
